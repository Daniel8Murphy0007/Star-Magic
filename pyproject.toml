[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqff"
version = "5.29.3"
description = "UQFF Star-Magic — vacuum-first unified physics framework (9 truly-independent primitives, all 8 Clay Millennium prize problems, complete SM 12-fermion spectrum, full proof corpus: 1994 whitepapers + Lean 4 scaffold + 4 arXiv bundles + manuscript)"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX string form (setuptools >=77).
# Commercial license terms are documented in COMMERCIAL.md and linked via project.urls below.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-AGPL-3.0.txt", "LICENSE-MIT-PREVIOUS.txt", "NOTICE"]
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" },
]
maintainers = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" },
]
keywords = [
    "physics",
    "unified field theory",
    "vacuum physics",
    "LENR",
    "low energy nuclear reactions",
    "cosmological constant",
    "Holmlid",
    "Star-Magic reactor",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium prize problems",
    "Lean 4",
    "formal verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = [
    "coverage>=7.0",
    "pytest>=7.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
jupyter = [
    "ipython>=8.0",
    "jupyter>=1.0",
]
all = [
    "coverage>=7.0",
    "pytest>=7.0",
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "ipython>=8.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic"
Documentation = "https://github.com/Daniel8Murphy0007/Star-Magic#readme"
Repository = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic/issues"
Changelog = "https://github.com/Daniel8Murphy0007/Star-Magic/blob/main/SESSION_LOG.md"
"Commercial License" = "https://github.com/Daniel8Murphy0007/Star-Magic/blob/main/COMMERCIAL.md"

[project.scripts]
uqff = "uqff_cli:main"
uqff-api = "uqff_api:run"

# ===========================================================================
# setuptools configuration
# ===========================================================================

[tool.setuptools]
py-modules = ["uqff_pure_calculator", "uqff_cli", "uqff_api", "uqff_jupyter", "uqff_fidelity_tests", "run_millennium_proofs", "BuoyancyProofVariants", "first_principles_derivation", "FirstPrinciplesCompressor", "Gold_Standard_Validation_Script"]
include-package-data = true

# v5.29.0: bundle the FULL proof corpus as a sub-package.
# Whitepapers, formal Lean, arXiv bundles, manuscript, audit outputs all ship.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "whitepapers",
    "whitepapers.*",
    "formal",
    "formal.*",
    "arxiv_submission_1159_1172",
    "arxiv_submission_1159_1172.*",
    "arxiv_submission_1173_1176",
    "arxiv_submission_1173_1176.*",
    "arxiv_submission_1177_1180",
    "arxiv_submission_1177_1180.*",
    "arxiv_submission_1181_1189",
    "arxiv_submission_1181_1189.*",
    "_audit_outputs",
    "_audit_outputs.*",
    "docs",
    "docs.*",
    "scripts",
    "scripts.*",
    "notebooks",
    "notebooks.*",
]
exclude = [
    "build*",
    "*.egg-info",
    "dist*",
    "__pycache__*",
    "node_modules*",
    ".venv*",
    "venv*",
    "*.dir*",
    "CMakeFiles*",
    "Debug*",
    "Release*",
    "x64*",
    "calculator_advanced*",
    "Manuscript 1_12Feb2026*",
]

# v5.29.0: package-data globs to include non-Python files in the wheel
[tool.setuptools.package-data]
"*" = [
    "*.md",
    "*.tex",
    "*.lean",
    "*.toml",
    "*.csv",
    "*.txt",
    "*.cpp",
    "*.html",
    "*.cff",
    "*.yml",
    "*.ipynb",
    "*.rst",
    "*.bib",
    "*.pdf",
    "*.json",
]
"whitepapers" = ["*.md", "*.tex"]
"formal" = ["*.lean", "*.toml", "lean-toolchain", "README.md", "**/*.lean"]
"arxiv_submission_1159_1172" = ["**/*"]
"arxiv_submission_1173_1176" = ["**/*"]
"arxiv_submission_1177_1180" = ["**/*"]
"arxiv_submission_1181_1189" = ["**/*"]
"_audit_outputs" = ["*.txt"]
"docs" = ["*.rst", "*.py", "*.md", "Makefile"]
"scripts" = ["*.py"]
"notebooks" = ["*.ipynb"]

