# ===========================================================================
# Tooling configuration
# ===========================================================================

[tool.coverage.run]
source = ["uqff_pure_calculator"]
omit = [
    "*/tests/*",
    "*/whitepapers/*",
    "*/arxiv_submission_*/*",
    "*/_audit_outputs/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["."]
python_files = ["uqff_fidelity_tests.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "whitepapers",
    "formal",
    "arxiv_submission_1159_1172",
    "arxiv_submission_1173_1176",
    "arxiv_submission_1177_1180",
    "arxiv_submission_1181_1189",
    "Manuscript 1_12Feb2026",
    "_audit_outputs",
    "*.PRE_*",
    "*.POST_*",
    "*.BROKEN_*",
    "*.TRUNCATED*",
    "*.CORRUPTED_*",
    "Gold_Standard_*",
    "99system_*",
    "Core",
    "uqff_pure_calculator_Test.py",
    "*_backup*",
    "*_BACKUP*",
    "RESTORE_POINT_*",
    "build", "dist", ".venv", ".git", "__pycache__",
    "_crosscheck_harness.cpp",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E701",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"uqff_pure_calculator.py" = ["E", "F", "W"]
"uqff_jupyter.py" = ["F401"]
"uqff_api.py" = ["F401"]
"uqff_cli.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
    "uqff_pure_calculator.py",
    "Gold_Standard_.*",
    "99system_.*",
    "whitepapers",
    "formal",
    "arxiv_submission_.*",
    "Manuscript 1_12Feb2026",
    "_audit_outputs",
]
