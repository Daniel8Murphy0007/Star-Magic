name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Print everything FIRST so the log tells the whole story even if a later step crashes.
      - name: Diagnostics — repo + python
        run: |
          python --version
          uname -a
          echo "PWD=$(pwd)"
          echo
          echo "=== Top-level files ==="
          ls -la
          echo
          echo "=== Critical file sizes (or NOT FOUND) ==="
          for f in uqff_pure_calculator.py uqff_fidelity_tests.py pyproject.toml README.md LICENSE scripts/ci_smoke.py scripts/ci_strip_nulls.py; do
            if [ -e "$f" ]; then
              wc -c "$f" || true
            else
              echo "$f: NOT FOUND"
            fi
          done

      - name: Verify critical files exist
        run: |
          missing=0
          for f in uqff_pure_calculator.py uqff_fidelity_tests.py pyproject.toml scripts/ci_smoke.py scripts/ci_strip_nulls.py; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required file(s) not in commit. Push them and re-run."
            exit 1
          fi

      - name: Strip trailing null bytes from test file (if any)
        run: python scripts/ci_strip_nulls.py

      - name: Run fidelity gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python uqff_fidelity_tests.py

      - name: Run public-surface smoke contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python scripts/ci_smoke.py

  fidelity-gate:
    name: Gate (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Strip trailing null bytes
        run: python scripts/ci_strip_nulls.py

      - name: Run UQFF fidelity gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python uqff_fidelity_tests.py

  coverage:
    name: Coverage measurement
    needs: smoke
    runs-on: ubuntu-latest
    continue-on-error: true       # informational only; never block PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install 'coverage>=7.0'

      - name: Strip trailing null bytes
        run: python scripts/ci_strip_nulls.py

      - name: Run coverage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m coverage run --source=uqff_pure_calculator uqff_fidelity_tests.py || true
          python -m coverage report --include='*uqff_pure_calculator*' | tee coverage_report.txt || true
          python -m coverage xml --include='*uqff_pure_calculator*' -o coverage.xml || true

      - name: Coverage step summary
        if: always()
        run: |
          {
            echo '```'
            cat coverage_report.txt 2>/dev/null || echo 'no coverage data'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  build-package:
    name: Build sdist + wheel
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.0' 'twine>=5.0' 'setuptools>=77'

      - name: Strip trailing null bytes
        run: python scripts/ci_strip_nulls.py

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check (warnings allowed)
        run: python -m twine check dist/* || true

      - name: List artifacts
        run: ls -la dist/

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: uqff-distribution
          path: dist/*
          retention-days: 90

  smoke-test-install:
    name: Install + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4    # need scripts/ci_smoke.py in CWD

      - uses: actions/download-artifact@v4
        with:
          name: uqff-distribution
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wheel from artifact
        shell: bash
        run: |
          for f in dist/uqff-*.whl; do
            echo "Installing $f"
            pip install "$f"
          done

      - name: Run installed-package smoke contract
        env:
          PYTHONIOENCODING: 'utf-8'
        run: python scripts/ci_smoke.py
