name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow+ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight quick-check on a single platform/Python.
  # Catches obvious breakage before the full matrix burns minutes.
  smoke:
    name: Smoke (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Strip trailing null bytes from test file
        run: |
          python -c "import pathlib; p=pathlib.Path('uqff_fidelity_tests.py'); d=p.read_bytes(); n=d.count(b'\x00'); p.write_bytes(d.replace(b'\x00', b'')); print(f'stripped {n} null bytes')"

      - name: Run fidelity gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python uqff_fidelity_tests.py

      - name: Import + public-surface sanity check (SOFT)
        run: |
          python - <<'PY'
          import uqff_pure_calculator as u
          publics = sorted(n for n in dir(u) if n.startswith('calculate_'))
          print(f"public calculate_* surfaces: {len(publics)}")
          # SOFT lower bound; values may grow but should never collapse below sane minimum
          assert len(publics) >= 30, f"public surface regression: only {len(publics)} surfaces"
          r = u.calculate_status_report({})['value']['summary']
          print(f"closures={r['total_closures']}, primitives={r['truly_independent_primitives']}+{r['derivative_primitives']}")
          # SOFT lower bounds (values are monotonically non-decreasing over time)
          assert r['total_closures'] >= 700, f"closure regression: {r['total_closures']}"
          assert r['truly_independent_primitives'] == 9
          assert r['derivative_primitives'] >= 2
          print("smoke OK")
          PY

  # Full matrix only runs if smoke passes — saves a lot of wasted minutes.
  fidelity-gate:
    name: Gate (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Strip trailing null bytes from test file
        run: |
          python -c "import pathlib; p=pathlib.Path('uqff_fidelity_tests.py'); d=p.read_bytes(); n=d.count(b'\x00'); p.write_bytes(d.replace(b'\x00', b'')); print(f'stripped {n} null bytes')"

      - name: Run UQFF fidelity gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python uqff_fidelity_tests.py

  coverage:
    name: Coverage measurement
    needs: smoke
    runs-on: ubuntu-latest
    continue-on-error: true       # informational only; never block PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install 'coverage>=7.0'

      - name: Strip trailing null bytes from test file
        run: |
          python -c "import pathlib; p=pathlib.Path('uqff_fidelity_tests.py'); d=p.read_bytes(); p.write_bytes(d.replace(b'\x00', b''))"

      - name: Run coverage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m coverage run --source=uqff_pure_calculator uqff_fidelity_tests.py
          python -m coverage report --include='*uqff_pure_calculator*' | tee coverage_report.txt
          python -m coverage xml --include='*uqff_pure_calculator*' -o coverage.xml || true

      - name: Coverage summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage XML as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  build-package:
    name: Build sdist + wheel
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.0' 'twine>=5.0' 'setuptools>=77'

      - name: Strip trailing null bytes from test file
        run: |
          python -c "import pathlib; p=pathlib.Path('uqff_fidelity_tests.py'); d=p.read_bytes(); p.write_bytes(d.replace(b'\x00', b''))"

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check (warnings allowed)
        run: python -m twine check dist/* || true

      - name: List artifacts
        run: ls -la dist/

      - name: Upload distribution as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uqff-distribution
          path: dist/*
          retention-days: 90

  smoke-test-install:
    name: Install + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uqff-distribution
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wheel from artifact
        shell: bash
        run: |
          # Cross-platform glob; bash on Windows works via Git Bash
          for f in dist/uqff-*.whl; do
            echo "Installing $f"
            pip install "$f"
          done

      - name: Smoke test (SOFT assertions, no hard-coded numbers)
        run: |
          python - <<'PY'
          import uqff_pure_calculator as u
          publics = sorted(n for n in dir(u) if n.startswith('calculate_'))
          print(f'public calculate_* surfaces: {len(publics)}')
          assert len(publics) >= 30, f'public surface regression: only {len(publics)}'

          r = u.calculate_status_report({})['value']['summary']
          print(f"closures: {r['total_closures']}")
          print(f"truly_independent_primitives: {r['truly_independent_primitives']}")
          print(f"derivative_primitives: {r['derivative_primitives']}")
          print(f"cosmic_milestones: {sum(r['cosmic_milestones'].values())} / {len(r['cosmic_milestones'])}")

          # SOFT bounds — never break on closure growth
          assert r['total_closures'] >= 700, f"regression: only {r['total_closures']} closures"
          assert r['truly_independent_primitives'] == 9
          assert r['derivative_primitives'] >= 2

          # Holmlid phonon energy in eV — wide tolerance band
          ker = u.calculate_lenr({})['value']['ker_chain']['E_phonon_eV']
          print(f"E_phonon (eV): {ker}")
          assert 0.001 < ker < 0.020, f"E_phonon outside sane range: {ker}"

          # U_i for Sun at t=0 should be 2.75e-7 (PAPER_646)
          ui = u.calculate_universal_inertial_operator({})['value']['U_i_dimensionless']
          print(f"U_i (dimensionless): {ui}")
          assert abs(ui - 2.75e-7) < 1e-8, f"U_i drift: {ui}"

          print('install + smoke: PASSED')
          PY
