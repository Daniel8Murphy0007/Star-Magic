name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'PyPI target (testpypi or pypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.0' 'twine>=5.0' 'setuptools>=77' 'sympy>=1.12' 'numpy>=1.24' 'scipy>=1.10' 'mpmath>=1.3' 'requests>=2.28'

      - name: Strip null bytes from test file
        run: python -c "import pathlib; p=pathlib.Path('uqff_fidelity_tests.py'); d=p.read_bytes(); p.write_bytes(d.replace(b'\x00',b''))"

      - name: Verify fidelity gate before release
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python uqff_fidelity_tests.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uqff-release-distribution
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/uqff
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: uqff-release-distribution
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/uqff
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: uqff-release-distribution
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: uqff-release-distribution
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer a curated RELEASE_NOTES_<tag>.md (under GitHub's 125 KB limit).
          # Fall back to auto-generated notes from commit history if absent.
          notes_file="RELEASE_NOTES_${{ github.ref_name }}.md"
          if [ -f "$notes_file" ]; then
            echo "Using curated notes: $notes_file"
            gh release create "${{ github.ref_name }}" \
              --title "UQFF Star-Magic ${{ github.ref_name }}" \
              --notes-file "$notes_file" \
              dist/*
          else
            echo "No curated notes file found; auto-generating from commits"
            gh release create "${{ github.ref_name }}" \
              --title "UQFF Star-Magic ${{ github.ref_name }}" \
              --generate-notes \
              dist/*
          fi
