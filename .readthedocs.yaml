# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Strip null bytes from the test file just like CI does, so docs build
      # doesn't choke on Windows-padded files in the repo.
      - python scripts/ci_strip_nulls.py || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
  - pdf
